<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>訂票完成 - 國營鐵路線上訂票</title>
</head>
<body>
  <div class="container">
    <div class="result-header">
      <h2>恭喜您，已完成線上訂票！</h2>
    </div>
    <div class="ticket-summary">
      <div class="row">
        <span class="label">訂票代碼：</span>
        <span class="value booking-code">6895537</span>
      </div>
      <div class="row">
        <span class="label">身分證字號：</span>
        <span class="value">A123456789</span>
      </div>
      <div class="row">
        <span class="label">乘車車次：</span>
        <span class="value">自強(3000) 175 次</span>
      </div>
      <div class="row">
        <span class="label">乘車區間：</span>
        <span class="value">09/25(星期五) 16:00 臺北 到 16:08 板橋</span>
      </div>
      <div class="row">
        <span class="label">座位資訊：</span>
        <span class="value">3 車 44 號, 3 車 46 號, 3 車 48 號, 3 車 42 號</span>
      </div>
      <div class="row payment-tip">
        <span>請於 09/24 (Thu) 24:00 前利用網路付款或至車站、超商完成取票。</span>
      </div>
    </div>
  </div>
</body>
</html>
